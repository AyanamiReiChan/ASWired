name: Frontend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check components and types
        run: pnpm check
      - name: Behavioral checks
        run: node --test tests/*.test.mjs tests/*.test.ts
      - name: Build
        run: pnpm build
      - name: Build independent probe
        run: node node_modules/vite/bin/vite.js build --config vite.probe.config.ts
      - name: Build and start website container
        run: |
          docker build --tag aswired-web:ci .
          trap 'docker rm -f aswired-web-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name aswired-web-ci --publish 127.0.0.1:3000:3000 --env ORIGIN=http://127.0.0.1:3000 aswired-web:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 --output /dev/null http://127.0.0.1:3000/
